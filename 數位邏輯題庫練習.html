<style>
/* Layout: one narrow column, like a worksheet. Start -> one question per screen -> result with review of mistakes. */
:root {
  --bg: #edf1f0;
  --surface: #ffffff;
  --fg: #14201f;
  --muted: #566866;
  --line: #cbd6d4;
  --accent: #0a6b5f;
  --accent-tint: #dcefec;
  --ok: #1d7a43;
  --ok-tint: #e0f3e7;
  --bad: #b3261e;
  --bad-tint: #fbe6e4;
  --paper: #ffffff;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1413; --surface: #152120; --fg: #e3eeec; --muted: #8fa6a2; --line: #2a3b39;
    --accent: #4fd1b8; --accent-tint: #173a35; --ok: #5bd68b; --ok-tint: #153a25;
    --bad: #ff8f86; --bad-tint: #4a1f1c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1413; --surface: #152120; --fg: #e3eeec; --muted: #8fa6a2; --line: #2a3b39;
  --accent: #4fd1b8; --accent-tint: #173a35; --ok: #5bd68b; --ok-tint: #153a25;
  --bad: #ff8f86; --bad-tint: #4a1f1c; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.7;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 56px;
}
.wrap { max-width: 720px; margin: 0 auto; }
h1, h2, h3, p { margin: 0; text-wrap: balance; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

/* buttons */
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 6px;
  padding: 10px 18px; min-height: 44px; font-weight: 500;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.primary:hover { filter: brightness(1.08); }
.btn[disabled] { opacity: .4; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 10px; }

/* start */
.hero { display: flex; flex-direction: column; gap: 10px; padding-block: 28px 20px; }
.hero h1 { font-size: clamp(28px, 7vw, 40px); line-height: 1.2; font-weight: 700; }
.hero p { color: var(--muted); max-width: 34em; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 20px; display: flex; flex-direction: column; gap: 18px; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field > .lab { font-weight: 500; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; }
.seg span { display: block; padding: 8px 16px; border: 1px solid var(--line); border-radius: 6px; min-width: 64px; text-align: center; font-family: var(--font-mono); cursor: pointer; }
.seg input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.check input { width: 20px; height: 20px; margin-top: 4px; accent-color: var(--accent); flex: none; }
.check small { display: block; color: var(--muted); font-size: 13px; line-height: 1.5; }
.history { color: var(--muted); font-size: 14px; }

/* quiz */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 20px; margin-top: 16px; display: flex; flex-direction: column; gap: 16px; }
.qmeta { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.qtext { font-size: 18px; line-height: 1.65; font-weight: 500; }
.figs { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; min-width: 0; }
.fig { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 8px 12px; max-width: 100%; overflow-x: auto; }
.fig img { display: block; max-width: none; height: auto; }
.opts { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none; }
.opt {
  width: 100%; text-align: left; display: flex; gap: 12px; align-items: baseline;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 6px; padding: 12px 14px; min-height: 48px;
}
.opt:hover { border-color: var(--accent); }
.opt .k { font-family: var(--font-mono); font-weight: 600; color: var(--muted); flex: none; width: 1.4em; }
.opt .t { min-width: 0; overflow-wrap: anywhere; }
.opt[aria-checked="true"] { border-color: var(--accent); background: var(--accent-tint); }
.opt[aria-checked="true"] .k { color: var(--accent); }
.ov { text-decoration: overline; text-decoration-thickness: 1.5px; }
.nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.warn { margin-top: 16px; border: 1px solid var(--bad); background: var(--bad-tint); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.jump { margin-top: 24px; display: flex; flex-direction: column; gap: 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; }
.grid button { border: 1px solid var(--line); background: var(--surface); border-radius: 4px; height: 34px; font-family: var(--font-mono); font-size: 13px; padding: 0; }
.grid button.done { background: var(--accent-tint); border-color: var(--accent); }
.grid button.cur { outline: 2px solid var(--fg); outline-offset: 1px; }

/* result */
.score { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
.score .big { font-family: var(--font-mono); font-size: clamp(44px, 12vw, 72px); font-weight: 600; line-height: 1; }
.score .big small { font-size: .4em; color: var(--muted); font-weight: 400; }
.stats { display: flex; gap: 8px 20px; flex-wrap: wrap; color: var(--muted); font-size: 15px; }
.stats b { color: var(--fg); font-family: var(--font-mono); }
.tabs { display: flex; gap: 8px; margin: 24px 0 4px; flex-wrap: wrap; }
.tab { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 6px; min-height: 40px; }
.tab[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.rev { display: flex; flex-direction: column; gap: 12px; }
.ans { border-radius: 6px; padding: 10px 14px; display: grid; grid-template-columns: 5.5em 1fr; gap: 4px 10px; align-items: baseline; }
.ans .lab { font-size: 13px; font-weight: 700; letter-spacing: .04em; }
.ans.bad { background: var(--bad-tint); }
.ans.bad .lab { color: var(--bad); }
.ans.good { background: var(--ok-tint); }
.ans.good .lab { color: var(--ok); }
.ans .val { min-width: 0; overflow-wrap: anywhere; }
.ans .val em { font-style: normal; color: var(--muted); }
.allclear { padding: 24px; text-align: center; border: 1px dashed var(--ok); border-radius: 8px; color: var(--ok); font-weight: 700; }
@media (max-width: 480px) { .card, .panel { padding: 16px; } .qtext { font-size: 17px; } .ans { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>

<div class="wrap">

<section id="start">
  <div class="hero">
    <div class="eyebrow">數位邏輯設計能力認證 · 學科題庫</div>
    <h1>數位邏輯設計<br>題庫練習</h1>
    <p>題目與選項每次都會重新打亂。全部作答完才會公布成績，再一次看完做錯的題目、你選的答案和正確答案。</p>
  </div>
  <div class="panel">

  <div class="nav">

    <div class="stats" id="stats"></div>

    <button class="btn" id="home" type="button">回到設定</button>
  </div>
  <div class="tabs" role="group" aria-label="檢討範圍">
    <button class="tab" id="tabWrong" type="button" aria-pressed="true"></button>
    <button class="tab" id="tabAll" type="button" aria-pressed="false"></button>
  </div>
  <div class="rev" id="rev"></div>
</section>

</div>

const LET = ["A", "B", "C", "D"];
const $ = id => document.getElementById(id);

let run = null; // {items, i, wrongOnly}
let reviewAll = false;

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function show(id) { for (const s of ["start", "quiz", "result"]) $(s).hidden = s !== id; window.scrollTo(0, 0); }

/* ---------- start ---------- */
const counts = [10, 25, 50, 75];
(function initStart() {
  const box = $("cnt");
  counts.forEach((n, k) => {
    const l = document.createElement("label");
    l.innerHTML = '<input type="radio" name="cnt" value="' + n + '"' + (n === 75 ? " checked" : "") + '><span>' + (n === 75 ? "全部 75" : n) + '</span>';
    box.appendChild(l);
  });
  try {
    const h = JSON.parse(localStorage.getItem("dl-last") || "null");
    if (h && h.total) { const e = $("history"); e.hidden = false; e.textContent = "上次成績：" + h.right + " / " + h.total + "（" + Math.round(h.right * 100 / h.total) + "%）"; }
  } catch (e) {}
})();

function prepare(q, doShuffle) {
  const idx = q.o.map((_, k) => k);
  const order = (q.f || !doShuffle) ? idx : shuffle(idx);
  return { q, opts: order.map(k => ({ t: q.o[k], orig: k })), pick: -1, right: order.indexOf(q.a) };
}
function startRun(list, doShuffle) {
  run = { items: shuffle(list).map(q => prepare(q, doShuffle)), i: 0, doShuffle };
  buildGrid(); show("quiz"); renderQ();
}
$("go").onclick = () => {
  const n = +document.querySelector('input[name="cnt"]:checked').value;
  startRun(shuffle(BANK).slice(0, n), $("shufOpt").checked);
};

/* ---------- quiz ---------- */
function figs(q) {
  if (!q.m.length) return "";
  return '<div class="figs">' + q.m.map(k => '<div class="fig"><img src="' + IMG[k] + '" alt="題目附圖"></div>').join("") + '</div>';
}
function renderQ() {
  const it = run.items[run.i], q = it.q, n = run.items.length;
  $("warn").hidden = true;
  $("card").innerHTML =
    '<div class="qmeta"><span class="eyebrow">第 ' + (run.i + 1) + ' 題</span><span class="eyebrow">題庫 #' + q.id + '</span></div>' +
    '<p class="qtext">' + q.q + '</p>' + figs(q) +
    '<div class="opts" role="radiogroup" aria-label="選項">' +
    it.opts.map((o, k) =>
      '<button type="button" class="opt" role="radio" aria-checked="' + (it.pick === k) + '" data-k="' + k + '">' +
      '<span class="k">' + LET[k] + '</span><span class="t">' + o.t + '</span></button>').join("") +
    '</div>';
  $("card").querySelectorAll(".opt").forEach(b => b.onclick = () => pick(+b.dataset.k));
  $("prev").disabled = run.i === 0;
  $("next").textContent = run.i === n - 1 ? "交卷" : "下一題";
  updateMeta();
}
function pick(k) {
  run.items[run.i].pick = k;
  $("card").querySelectorAll(".opt").forEach(b => b.setAttribute("aria-checked", String(+b.dataset.k === k)));
  $("warn").hidden = true;
  updateMeta();
}
function answered() { return run.items.filter(x => x.pick >= 0).length; }
function updateMeta() {
  const n = run.items.length, a = answered();
  $("prog").textContent = (run.i + 1) + " / " + n;
  $("ansCount").textContent = "已答 " + a + " / " + n;
  $("barFill").style.width = (a * 100 / n) + "%";
  [...$("grid").children].forEach((b, k) => {
    b.classList.toggle("done", run.items[k].pick >= 0);
    b.classList.toggle("cur", k === run.i);
  });
}
function buildGrid() {
  const g = $("grid"); g.innerHTML = "";
  run.items.forEach((_, k) => {
    const b = document.createElement("button"); b.type = "button"; b.textContent = k + 1;
    b.setAttribute("aria-label", "第 " + (k + 1) + " 題");
    b.onclick = () => { run.i = k; renderQ(); };
    g.appendChild(b);
  });
}
$("prev").onclick = () => { if (run.i > 0) { run.i--; renderQ(); } };
$("next").onclick = () => {
  if (run.i < run.items.length - 1) { run.i++; renderQ(); return; }
  const miss = run.items.length - answered();
  if (miss === 0) return finish();
  $("warnText").textContent = "還有 " + miss + " 題沒有作答，交卷後會算答錯。";
  $("warn").hidden = false;
};
$("warnBack").onclick = () => {
  const k = run.items.findIndex(x => x.pick < 0);
  if (k >= 0) { run.i = k; renderQ(); }
};
$("warnGo").onclick = finish;
document.addEventListener("keydown", e => {
  if ($("quiz").hidden || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = ["a", "b", "c", "d", "1", "2", "3", "4"].indexOf(e.key.toLowerCase());
  if (k >= 0 && k % 4 < run.items[run.i].opts.length) { pick(k % 4); }
  else if (e.key === "ArrowRight") $("next").click();
  else if (e.key === "ArrowLeft") $("prev").click();
});

/* ---------- result ---------- */
function finish() {
  const items = run.items, n = items.length;
  const wrong = items.filter(x => x.pick !== x.right);
  const right = n - wrong.length, blank = items.filter(x => x.pick < 0).length;
  run.wrong = wrong;
  $("scoreBig").innerHTML = right + '<small> / ' + n + '</small>';
  $("stats").innerHTML = '<span>答對率 <b>' + Math.round(right * 100 / n) + '%</b></span><span>答錯 <b>' + (wrong.length - blank) + '</b></span><span>未作答 <b>' + blank + '</b></span>';
  $("tabWrong").textContent = "做錯的題目 (" + wrong.length + ")";
  $("tabAll").textContent = "全部題目 (" + n + ")";
  $("redoWrong").disabled = wrong.length === 0;
  try { localStorage.setItem("dl-last", JSON.stringify({ right, total: n })); } catch (e) {}
  reviewAll = false; renderReview(); show("result");
}
function renderReview() {
  $("tabWrong").setAttribute("aria-pressed", String(!reviewAll));
  $("tabAll").setAttribute("aria-pressed", String(reviewAll));
  const list = reviewAll ? run.items : run.wrong;
  if (!list.length) { $("rev").innerHTML = '<div class="allclear">全部答對</div>'; return; }
  $("rev").innerHTML = list.map(it => {
    const no = run.items.indexOf(it) + 1, q = it.q, ok = it.pick === it.right;
    const mine = it.pick < 0 ? "<em>未作答</em>" : '<span class="mono">(' + LET[it.pick] + ')</span> ' + it.opts[it.pick].t;
    const good = '<span class="mono">(' + LET[it.right] + ')</span> ' + it.opts[it.right].t;
    return '<article class="card" style="margin-top:0">' +
      '<div class="qmeta"><span class="eyebrow">第 ' + no + ' 題 ' + (ok ? "· 答對" : "· 答錯") + '</span><span class="eyebrow">題庫 #' + q.id + '</span></div>' +
      '<p class="qtext">' + q.q + '</p>' + figs(q) +
      (ok ? '' : '<div class="ans bad"><span class="lab">你的答案</span><span class="val">' + mine + '</span></div>') +
      '<div class="ans good"><span class="lab">正確答案</span><span class="val">' + good + '</span></div>' +
      '</article>';
  }).join("");
}
$("tabWrong").onclick = () => { reviewAll = false; renderReview(); };
$("tabAll").onclick = () => { reviewAll = true; renderReview(); };
$("again").onclick = () => startRun(run.items.map(x => x.q), run.doShuffle);
$("redoWrong").onclick = () => startRun(run.wrong.map(x => x.q), run.doShuffle);
$("home").onclick = () => show("start");
</script>

</body></html>
